<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Signup — MarketMint</title><link rel="stylesheet" href="styles.css"/></head><body data-page="auth"><div class="ambient-noise"></div><div class="cursor-glow"></div><div class="scene scene-auth" aria-hidden="true"><div class="scene-grid"></div><div class="globe-wrap"><div class="globe"><div class="globe-grid"></div><div class="globe-core"></div></div><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span><span class="orbit orbit-c"></span></div><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="diamond diamond-2"></span></div><header class="auth-nav"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MarketMint</span></a><a class="text-link" href="index.html">← Back to universe</a></header><main class="auth-page"><div class="auth-card glass-card auth-wide reveal"><div class="eyebrow">CREATE YOUR IDENTITY</div><h1>Step into <span>MarketMint.</span></h1><p>Choose your role. Build your world.</p><form id="signupForm" class="signup-form"><div class="field-grid"><label>Full Name<input type="text" required placeholder="Your full name"/></label><label>Username<input type="text" required placeholder="marketmint_id"/></label><label>Email<input type="email" required placeholder="you@example.com"/></label><label>Phone<input type="tel" required placeholder="+91 98765 43210"/></label><label>Password<input id="signupPassword" type="password" required placeholder="Create a password"/></label><label>Confirm Password<input id="signupConfirm" type="password" required placeholder="Repeat your password"/></label></div><div class="account-type"><span>Account Type</span><label class="role-option active"><input type="radio" name="role" value="buyer" checked/> <strong>Buyer</strong><small>Discover and acquire.</small></label><label class="role-option"><input type="radio" name="role" value="seller"/> <strong>Seller</strong><small>Build your storefront.</small></label></div><label class="check terms"><input type="checkbox" required/> <span>I agree to the MarketMint Terms, Privacy and Security standards.</span></label><button class="btn btn-gold btn-block" type="submit">Create Account →</button></form><div class="divider"><span>or continue with</span></div><div class="social-row"><button class="social-btn">G</button><button class="social-btn"></button><button class="social-btn">M</button></div><p class="auth-foot">Already part of MarketMint? <a href="login.html">Login</a></p></div></main><script src="script.js"></script></body></html>
